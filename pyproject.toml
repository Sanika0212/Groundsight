[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "groundsight"
version = "0.1.0"
description = "See which claims in a RAG answer your sources don't support, why, and which fix works"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
requires-python = ">=3.11"
keywords = ["rag", "hallucination", "grounding", "fact-checking", "attribution", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=4.25"]
bench = ["pandas>=2.2", "pyarrow>=17"]
viz = ["matplotlib>=3.9", "pillow>=10.4"]

[project.scripts]
groundsight = "groundsight.cli:main"

[project.entry-points.pytest11]
groundsight = "groundsight.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Sanika0212/Groundsight"
Issues = "https://github.com/Sanika0212/Groundsight/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/groundsight"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/groundsight"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "matplotlib.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = ["models: needs model weights (skipped unless GROUNDSIGHT_TEST_MODELS=1)"]

[tool.coverage.run]
source = ["groundsight"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
